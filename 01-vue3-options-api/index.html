<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    <div id="app">
        <h1>{{mayusculasTexto}}</h1>
        <!-- <h2 :class="[cantidad > 500 ? 'text-success' : 'text-danger']">Mi saldo disponible: {{cantidad }}</h2> -->
        <h2 :class="colorCantidad">Mi saldo disponible: {{cantidad }}</h2>
        <a v-bind:href="enlace">Ir a enlace</a>

        <hr>

        <h2 v-if="estado">Cuenta Disponible</h2>
        <h2 v-else>Cuenta No Disponible</h2>

        <hr>

        <h2 v-if="cantidad > 500">Cantidad: {{ cantidad }}</h2>
        <h2 v-else-if="cantidad <= 500 && cantidad > 0">
            Cantidad: 
            <span style="color: red">{{cantidad}}</span>
        </h2>
        <h2 v-else>Sin cantidad</h2>

        <hr>

        <ul>
            <li
                v-for="(servicio, index) in servicios"
                :key="index"
            >
                {{index+1}}. {{servicio}}
            </li>
        </ul>
        <hr>

        <button v-on:click="agregarSaldo(100)">Agregar 100</button>
        <button :disabled="desactivar" @:click="disminuirSaldo(100)">Disminuir 100</button>

    </div>

    <script src="./main.js"></script>
    <script>
        const mountedApp = app.mount('#app')
    </script>
</body>
</html>
